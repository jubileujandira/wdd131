<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Templos Filtrados</title>

    <meta name="description"
        content="Álbum interativo com informações e filtros de templos de A Igreja de Jesus Cristo dos Santos dos Últimos Dias.">

    <meta name="author" content="José Leandro Moura">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="estilos/templos-filtered.css">
    <link rel="stylesheet" href="estilos/templos-grande.css">

    <script src="scripts/templos-filtered.js" defer></script>
</head>

<body>

    <header>
        <div class="titulo">Álbum de Templos</div>

        <button
            id="menuButton"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false">
            ☰
        </button>

        <nav id="menu" aria-label="Filtros de templos">
            <a href="#" id="home">Página Inicial</a>
            <a href="#" id="old">Antigos</a>
            <a href="#" id="new">Novos</a>
            <a href="#" id="large">Grandes</a>
            <a href="#" id="small">Pequenos</a>
        </nav>
    </header>

    <main>
        <h1 id="pageTitle">Todos os Templos</h1>

        <section
            id="templeCards"
            class="galeria"
            aria-label="Lista de templos">
        </section>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            José Leandro Moura
        </p>

        <p>
            Última modificação:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>

</html>
