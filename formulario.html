<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Formulário para usuários enviarem uma revisão de produto na disciplina WDD 131."
    >
    <meta
        name="author"
        content="José Leandro da Silva Moura"
    >

    <title>Revisão de Produto | WDD 131</title>

    <link
        rel="stylesheet"
        href="estilos/formulario.css"
    >

    <script
        src="scripts/formulario.js"
        defer
    ></script>
</head>

<body>
    <header>
        <h1>Revisão de Produto</h1>
    </header>

    <main>
        <form
            method="get"
            action="avaliacao.html"
        >
            <div class="campo">
                <label for="produto">
                    Nome do Produto
                    <span
                        class="obrigatorio"
                        aria-hidden="true"
                    >*</span>
                </label>

                <select
                    id="produto"
                    name="produto"
                    required
                >
                    <option value="" disabled selected>Selecione um Produto...</option>
                </select>
            </div>

            <fieldset class="campo">
                <legend>
                    Classificação Geral
                    <span
                        class="obrigatorio"
                        aria-hidden="true"
                    >*</span>
                </legend>

                <div class="classificacao">
                    <label for="nota1">
                        <span aria-hidden="true">☆</span>
                        <span class="texto-leitor">1 estrela</span>

                        <input
                            type="radio"
                            id="nota1"
                            name="classificacao"
                            value="1"
                            required
                        >
                    </label>

                    <label for="nota2">
                        <span aria-hidden="true">☆☆</span>
                        <span class="texto-leitor">2 estrelas</span>

                        <input
                            type="radio"
                            id="nota2"
                            name="classificacao"
                            value="2"
                            required
                        >
                    </label>

                    <label for="nota3">
                        <span aria-hidden="true">☆☆☆</span>
                        <span class="texto-leitor">3 estrelas</span>

                        <input
                            type="radio"
                            id="nota3"
                            name="classificacao"
                            value="3"
                            required
                        >
                    </label>

                    <label for="nota4">
                        <span aria-hidden="true">☆☆☆☆</span>
                        <span class="texto-leitor">4 estrelas</span>

                        <input
                            type="radio"
                            id="nota4"
                            name="classificacao"
                            value="4"
                            required
                        >
                    </label>

                    <label for="nota5">
                        <span aria-hidden="true">☆☆☆☆☆</span>
                        <span class="texto-leitor">5 estrelas</span>

                        <input
                            type="radio"
                            id="nota5"
                            name="classificacao"
                            value="5"
                            required
                        >
                    </label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="data-instalacao">
                    Data de Instalação
                    <span
                        class="obrigatorio"
                        aria-hidden="true"
                    >*</span>
                </label>

                <input
                    type="date"
                    id="data-instalacao"
                    name="data-instalacao"
                    required
                >
            </div>

            <fieldset class="campo recursos">
                <legend>
                    Quais recursos você achou úteis no produto?

                    <span class="instrucao">
                        Marque todos os que se aplicam.
                    </span>
                </legend>

                <label for="durabilidade">
                    <input
                        type="checkbox"
                        id="durabilidade"
                        name="recursos"
                        value="durabilidade"
                    >
                    Durabilidade
                </label>

                <label for="facilidade-uso">
                    <input
                        type="checkbox"
                        id="facilidade-uso"
                        name="recursos"
                        value="facilidade-de-uso"
                    >
                    Facilidade de Uso
                </label>

                <label for="desempenho">
                    <input
                        type="checkbox"
                        id="desempenho"
                        name="recursos"
                        value="desempenho"
                    >
                    Desempenho
                </label>

                <label for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="recursos"
                        value="design"
                    >
                    Design
                </label>
            </fieldset>

            <div class="campo">
                <label for="avaliacao-escrita">
                    Avaliação Escrita
                    <span class="opcional">
                        (Opcional)
                    </span>
                </label>

                <textarea
                    id="avaliacao-escrita"
                    name="avaliacao-escrita"
                    rows="6"
                ></textarea>
            </div>

            <div class="campo">
                <label for="nome-usuario">
                    Seu Nome
                    <span class="opcional">
                        (Opcional)
                    </span>
                </label>

                <input
                    type="text"
                    id="nome-usuario"
                    name="nome-usuario"
                    autocomplete="name"
                >
            </div>

            <input
                type="submit"
                class="botao-enviar"
                value="Publicar Avaliação"
            >
        </form>
    </main>

    <footer>
        <p>
            &copy;
            <span id="ano-atual"></span>
            🌺 José Leandro da Silva Moura 🌺
        </p>

        <p id="ultima-modificacao"></p>
    </footer>
</body>

</html>
