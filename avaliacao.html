<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Página de confirmação do envio da avaliação de produto."
    >
    <meta name="author" content="José Leandro da Silva Moura">

    <title>Avaliação Enviada | WDD 131</title>

    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/avaliacao.js" defer></script>
</head>

<body>
    <header>
        <h1>Avaliação Enviada</h1>
    </header>

    <main>
        <section class="confirmacao">
            <h2>Obrigado pela sua avaliação!</h2>

            <p>
                Sua avaliação de produto foi enviada com sucesso.
            </p>

            <div class="contador">
                <p>
                    Número de avaliações concluídas neste navegador:
                </p>

                <strong id="contador-avaliacoes">0</strong>
            </div>

            <a href="formulario.html" class="link-voltar">
                Enviar outra avaliação
            </a>
        </section>
    </main>

    <footer>
        <p>
            &copy; <span id="ano-atual"></span>
            🌺 José Leandro da Silva Moura 🌺
        </p>

        <p id="ultima-modificacao"></p>
    </footer>
</body>

</html>
